<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post — Soomro (S.) Irfan Ali</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site" role="banner">
    <div class="wrap">
      <div class="brand">Accountant <span>Irfan Ali</span></div>
      <nav aria-label="Primary">
        <ul>
          <li><a href="/">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" id="post-root">
    <!-- post content will be injected here by assets/main.js -->
  </main>

  <footer class="wrap">© 2026 Soomro (S.) Irfan Ali</footer>

  <script src="/assets/main.js" defer></script>
  <script>
    // read ?slug=... from querystring
    (function(){
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const root = document.getElementById('post-root');
      if (!slug) {
        root.innerHTML = '<p>No post specified.</p>';
        return;
      }
      if (window.renderPostBySlug) {
        window.renderPostBySlug(slug, root);
      } else {
        root.innerHTML = '<p>Loading...</p>';
      }
    })();
  </script>
</body>
</html>
